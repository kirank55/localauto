<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Return visit demo</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Second application</p>
      <h1>Same questions, different wording</h1>
      <p>Exact questions fill on click. Paraphrases wait for Accept.</p>
      <form>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" />
        </div>
        <div class="field">
          <label>Are you legally authorised to work in the US?</label>
          <div class="choices">
            <label><input type="radio" name="auth" value="yes" /> Yes</label>
            <label><input type="radio" name="auth" value="no" /> No</label>
          </div>
        </div>
        <div class="field">
          <label>Are you authorized to work in the UK?</label>
          <div class="choices">
            <label><input type="radio" name="uk" value="yes" /> Yes</label>
            <label><input type="radio" name="uk" value="no" /> No</label>
          </div>
        </div>
        <div class="field">
          <label for="why">Why do you want this role?</label>
          <textarea id="why" name="why"></textarea>
        </div>
        <div class="field">
          <label for="python">Years of Python experience</label>
          <input id="python" name="python" type="text" />
        </div>
        <div class="field">
          <label for="visa">Will you require visa sponsorship?</label>
          <select id="visa" name="visa">
            <option value="">Please select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
        <div class="field">
          <label>Are you a veteran?</label>
          <div class="choices">
            <label><input type="radio" name="veteran" value="yes" /> Yes</label>
            <label><input type="radio" name="veteran" value="no" /> No</label>
          </div>
        </div>
        <div class="field">
          <label for="about">Tell us about a project you shipped</label>
          <textarea id="about" name="about"></textarea>
        </div>
      </form>
    </main>
  </body>
</html>
