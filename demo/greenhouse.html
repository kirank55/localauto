<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greenhouse application demo</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Greenhouse-style demo</p>
      <h1>Product engineer</h1>
      <p>This page is local. Nothing here is sent to Greenhouse.</p>
      <form id="application-form">
        <div class="field">
          <label for="first_name">First Name</label>
          <input id="first_name" name="job_application[first_name]" type="text" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="last_name">Last Name</label>
          <input id="last_name" name="job_application[last_name]" type="text" autocomplete="family-name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="job_application[email]" type="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="job_application[phone]" type="tel" autocomplete="tel" />
        </div>
        <div class="field">
          <label for="linkedin">LinkedIn Profile</label>
          <input id="linkedin" name="job_application[linkedin]" type="url" />
        </div>
        <div class="field">
          <label for="github">GitHub</label>
          <input id="github" name="job_application[github]" type="url" />
        </div>
        <div class="field">
          <label for="website">Website</label>
          <input id="website" name="job_application[website]" type="url" />
        </div>
        <input type="hidden" name="honeypot" value="" />
        <div class="field">
          <label>Are you authorized to work in the United States?</label>
          <div class="choices">
            <label><input type="radio" name="job_application[answers_attributes][0][boolean_value]" value="1" /> Yes</label>
            <label><input type="radio" name="job_application[answers_attributes][0][boolean_value]" value="0" /> No</label>
          </div>
        </div>
        <div class="field">
          <label for="sponsor">Will you now or in the future require sponsorship?</label>
          <select id="sponsor" name="job_application[answers_attributes][1]">
            <option value="">Please select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
        <div class="field">
          <label for="why">Why do you want this role?</label>
          <textarea id="why" name="job_application[answers_attributes][2][text_value]"></textarea>
        </div>
        <div class="field">
          <label for="python">How many years of Python experience do you have?</label>
          <input id="python" name="job_application[answers_attributes][3][text_value]" type="text" />
        </div>
      </form>
    </main>
  </body>
</html>
