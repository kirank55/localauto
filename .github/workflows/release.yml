# Test, build the Chrome zip, attach a SHA-256 sum, and publish one
# GitHub release. Pushing a v* tag runs it. The tag must match
# package.json (v0.1.0-beta.1 for version 0.1.0-beta.1). Tags with a
# "-" are prereleases. Release notes come from docs/releases/<tag>.md
# when that file exists.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Tag matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json is $pkg but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Check
        run: npm run check
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: End to end
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run test:e2e
      - name: Package
        run: |
          npm run zip
          mkdir -p dist
          mapfile -t zips < <(find .output -maxdepth 1 -type f -name 'localauto-*-chrome.zip' -printf '%f\n')
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected one zip, found: ${zips[*]}" >&2
            exit 1
          fi
          cp ".output/${zips[0]}" "dist/${zips[0]}"
          (cd dist && sha256sum "${zips[0]}" | tee "${zips[0]}.sha256")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            flags+=(--notes-file "$notes")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            "${flags[@]}"
