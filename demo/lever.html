<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lever application demo</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Lever-style demo</p>
      <h1>Support engineer</h1>
      <p>This page is local. Nothing here is sent to Lever.</p>
      <form class="application-form">
        <div class="application-field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" />
        </div>
        <div class="application-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" />
        </div>
        <div class="application-field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" />
        </div>
        <div class="application-field">
          <label for="linkedin">LinkedIn</label>
          <input id="linkedin" name="urls[LinkedIn]" type="url" />
        </div>
        <div class="application-field">
          <label for="github">GitHub</label>
          <input id="github" name="urls[GitHub]" type="url" />
        </div>
        <div class="application-field">
          <label for="portfolio">Portfolio</label>
          <input id="portfolio" name="urls[Portfolio]" type="url" />
        </div>
        <div class="application-question">
          <div class="application-label">Why do you want this role?</div>
          <textarea name="cards[0][field0]"></textarea>
        </div>
      </form>
    </main>
  </body>
</html>
